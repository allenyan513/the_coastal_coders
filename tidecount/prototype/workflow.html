<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideflow workflow prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Pure front-end prototype of the procedure-first workflow. One file, no backend. State lives in localStorage. */
  :root {
    --bg: #f3f6f5; --surface: #ffffff; --fg: #15262b; --muted: #5b6d72; --line: #d3dddd;
    --accent: #0f6e6a; --accent-soft: #dcefec; --warn: #a35a00; --warn-soft: #fbeedb; --bad: #b4232c; --bad-soft: #fae3e4;
    --ok: #1f7a3a; --ok-soft: #dff2e4;
    --body: "Noto Sans", system-ui, sans-serif; --mono: "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a1d; --surface: #16252a; --fg: #e6eeee; --muted: #9fb2b6; --line: #2a3b40; --accent: #5fc9c0; --accent-soft: #163b3a; --warn: #f0b35c; --warn-soft: #3a2a12; --bad: #f08a90; --bad-soft: #3d1a1c; --ok: #6fd08a; --ok-soft: #173a22; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; letter-spacing: .02em; text-decoration: none; color: var(--fg); }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .steps { display: flex; gap: 4px; flex-wrap: wrap; }
  .steps a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .steps a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .steps a .st { font-family: var(--mono); font-size: 12px; }
  .steps a.done .st { color: var(--ok); }
  .top .spacer { flex: 1; }
  .top .me { color: var(--muted); font-size: 13px; }
  main { padding: 20px; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 24px; margin: 0; line-height: 1.25; }
  h2 { font-size: 17px; margin: 0; }
  h3 { font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  p { margin: 0; }
  .lede { color: var(--muted); max-width: 70ch; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--bg); color: var(--fg); font-size: 15px; }
  .field input[type=number] { width: 110px; font-family: var(--mono); }
  .field textarea { min-height: 64px; resize: vertical; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .pill.muted { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .note { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 12px; font-size: 13px; border-radius: 0 6px 6px 0; }
  .note.ok { background: var(--ok-soft); border-color: var(--ok); }
  .note.bad { background: var(--bad-soft); border-color: var(--bad); }
  .note.info { background: var(--accent-soft); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  td.r, th.r { text-align: right; }
  .tablewrap { overflow-x: auto; }
  .vwrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
  .vwrap video { width: 100%; height: 100%; display: block; }
  .vwrap .overlay { position: absolute; inset: 0; pointer-events: none; }
  .vwrap .box { position: absolute; border: 2px solid #ffd166; box-shadow: 0 0 0 1px rgba(0,0,0,.5); border-radius: 2px; }
  .vwrap .stamp { position: absolute; left: 10px; top: 10px; font-family: var(--mono); font-size: 13px; background: rgba(0,0,0,.65); color: #fff; padding: 3px 8px; border-radius: 4px; }
  .vwrap .stamp.now { background: #0f6e6a; }
  .vwrap .missing { position: absolute; inset: 0; display: grid; place-items: center; color: #ccc; text-align: center; padding: 20px; font-size: 14px; }
  .clipbar { position: relative; height: 14px; border-radius: 7px; background: var(--accent-soft); overflow: hidden; }
  .clipbar .second { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .9; }
  .clipbar .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); }
  .clipscale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .timeline { position: relative; height: 34px; background: var(--accent-soft); border-radius: 6px; overflow: hidden; cursor: pointer; }
  .timeline .band { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .55; }
  .timeline .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg); opacity: .35; }
  .timeline .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
  .points { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .points button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  .points button .t { font-family: var(--mono); }
  .points button .n { font-weight: 700; font-size: 14px; }
  .points button[aria-current] { border-color: var(--accent); background: var(--accent-soft); }
  .points button.counted { border-color: var(--ok); }
  .points button.cns { border-color: var(--warn); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .kpi b { font-size: 26px; font-family: var(--mono); line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi small { font-size: 12px; color: var(--muted); }
  .vlist { display: flex; flex-direction: column; }
  .vrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .vrow:last-child { border-bottom: 0; }
  .vrow .name { font-weight: 600; }
  .vrow .sub { color: var(--muted); font-size: 13px; }
  .splist { display: flex; flex-direction: column; gap: 6px; }
  .sprow { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 10px; align-items: center; font-size: 14px; }
  .sprow canvas { width: 56px; height: 32px; border-radius: 3px; background: #000; }
  .keys { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .keys kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .aicheck { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .aicheck.same { border-color: var(--ok); background: var(--ok-soft); }
  .hidden { display: none !important; }
  .sprows { display: flex; flex-direction: column; gap: 6px; }
  .sprows .row input[type=text] { flex: 1; min-width: 120px; }
  .sprows .row input { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--bg); color: var(--fg); }
  .sprows .row input[type=number] { width: 70px; font-family: var(--mono); }
  .foot { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#survey">Tideflow <small>prototype · procedure v1</small></a>
  <nav class="steps" id="steps"></nav>
  <span class="spacer"></span>
  <label class="me">Counting as <input id="me" placeholder="your name" style="border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--bg);color:inherit;width:130px"></label>
  <a class="btn sm" href="#settings">Settings</a>
</div>
<main id="main"></main>

<script src="data-411.js"></script>
<script>
// ---------- state ----------
const KEY = "tidecount-proto-v1";
const DEFAULT_PROTOCOL = { version: 1, trimStart: 60, trimEnd: 60, extraTrim: 240, windowS: 900, everyS: 60, contextS: 5, clearShare: 0.5, clearForS: 120, qcShare: 0.10, qcMin: 6, qcMaxDiff: 6, qcAgree: 95 };
const SPECIES = ["Cunner", "Winter flounder", "Pollock", "Atlantic silverside", "Mummichog", "Three-spined stickleback", "Atlantic tomcod", "Shorthorn sculpin", "Rock gunnel", "American eel", "Green crab", "Rock crab", "American lobster", "Sand shrimp", "Periwinkle"];
const VIS = ["<0.5 m", "0.5-1.0 m", "1.0-1.5 m", ">1.5 m"];
const NOTE_CHIPS = ["shape + movement", "colour flash only", "fins visible", "possibly more fish, unconfirmed", "turbid", "dark / blurred", "fish entered after the second, not counted"];
const VIDEOS = [
  { id: "5aa1bf900e", name: "T1-STAT2 411.MP4", duration: 2147.28, sample: () => window.SAMPLE_411 },
  { id: "t1s1-408", name: "T1-STAT1 408.MP4", duration: 1215, sample: null },
  { id: "t2s2-415", name: "T2-STAT2 415.MP4", duration: 1190, sample: null },
];

function load() {
  try { return Object.assign({ protocol: { ...DEFAULT_PROTOCOL }, me: "", videoUrl: "http://localhost:8000/api/videos/5aa1bf900e/proxy", videos: {} }, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return { protocol: { ...DEFAULT_PROTOCOL }, me: "", videoUrl: "", videos: {} }; }
}
const S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function vstate(id) { return S.videos[id] ??= { setup: null, species: [], points: {}, validation: null }; }

// ---------- helpers ----------
const clock = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clock1 = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const parseClock = (str) => { const m = String(str).trim().match(/^(\d+):(\d{1,2})$/); return m ? +m[1] * 60 + +m[2] : NaN; };
const median = (a) => { const b = [...a].sort((x, y) => x - y); return b.length ? (b.length % 2 ? b[(b.length - 1) / 2] : (b[b.length / 2 - 1] + b[b.length / 2]) / 2) : 0; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const transectStat = (name) => { const t = name.match(/(?<![A-Za-z0-9])T(\d+)/), s = name.match(/STAT\s*(\d+)/i); return { transect: t ? t[1] : "", stat: s ? s[1] : "" }; };
let CUR = VIDEOS[0];
const P = () => S.protocol;

function maxStart(v) { return Math.max(P().trimStart, Math.floor(v.duration - P().trimEnd - P().windowS)); }
function suggestStart(v) {
  const d = v.sample?.(); if (!d) return P().trimStart;
  const c = d.clarity, m = median(c.filter(Boolean)), need = P().clearShare * m, top = maxStart(v);
  for (let s = P().trimStart; s <= top; s++) if (median(c.slice(s, s + P().clearForS)) >= need) return s;
  return P().trimStart;
}
function pointTimes(v) { const st = vstate(v.id).setup; if (!st) return []; const n = Math.floor(P().windowS / P().everyS); return Array.from({ length: n }, (_, i) => st.start + i * P().everyS); }
function aiAt(v, t) { const d = v.sample?.(); return d ? (d.detections[Math.floor(t)] ?? 0) : null; }
function boxesAt(v, t) { const d = v.sample?.(); return d ? (d.boxes[String(Math.floor(t))] ?? []) : []; }
function segments(v, from, to) {
  const d = v.sample?.(); if (!d) return [];
  const out = []; let cur = null;
  for (let s = Math.floor(from); s < Math.min(to, d.detections.length); s++) {
    const on = d.detections[s] >= 1;
    if (on) { if (cur && s - cur.end <= 5) { cur.end = s + 1; cur.peak = Math.max(cur.peak, d.detections[s]); } else { cur = { start: s, end: s + 1, peak: d.detections[s] }; out.push(cur); } }
  }
  return out.filter((x) => x.end - x.start >= 3);
}
function pointStatus(v, i) { const p = vstate(v.id).points[i]; return !p ? "open" : p.couldNotSee ? "could-not-see" : "counted"; }
function progress(v) { const ts = pointTimes(v); return { done: ts.filter((_, i) => pointStatus(v, i) !== "open").length, total: ts.length }; }
function meanCount(v, counts) { const vals = counts.filter((x) => x !== null); return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null; }
function qcSample(v) { const n = pointTimes(v).length, k = Math.min(n, Math.max(P().qcMin, Math.ceil(n * P().qcShare))); let seed = 0; for (const ch of v.id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0; const idx = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { seed = (seed * 1103515245 + 12345) >>> 0; const j = seed % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx.slice(0, k).sort((a, b) => a - b); }
function diffPct(a, b) { if (a === b) return 0; const m = (a + b) / 2; return m ? Math.abs(a - b) / m * 100 : 100; }
function videoStage(v) {
  const vs = vstate(v.id); if (!v.sample) return "Video not on this PC";
  if (!vs.setup) return "Set up";
  const pr = progress(v); if (pr.done < pr.total) return pr.done ? `Counting ${pr.done} of ${pr.total}` : "Count";
  const val = vs.validation; if (!val || Object.keys(val.counts).length < qcSample(v).length) return "Validate";
  return validationResult(v).pass ? "Validated" : "Recount";
}
function validationResult(v) {
  const vs = vstate(v.id), val = vs.validation || { counts: {} }, sample = qcSample(v);
  const rows = sample.map((i) => { const a = vs.points[i], b = val.counts[i]; if (!b || !a || a.couldNotSee) return { i, a: a?.couldNotSee ? null : a?.total ?? null, b: b?.total ?? null, diff: null }; const d = diffPct(a.total, b.total); return { i, a: a.total, b: b.total, diff: d, third: b.third ?? null }; });
  const done = rows.filter((r) => r.diff !== null), within = done.filter((r) => r.diff <= P().qcMaxDiff), agree = done.length ? within.length / done.length * 100 : null;
  return { rows, agree, pass: done.length === sample.length && agree >= P().qcAgree, complete: done.length === sample.length };
}

// ---------- shell ----------
const STEPS = [["survey", "Videos"], ["setup", "Set up"], ["species", "Species pass"], ["count", "Count"], ["validate", "Validate"], ["report", "Report"]];
function renderShell(screen) {
  const vs = vstate(CUR.id), pr = progress(CUR);
  const st = { setup: vs.setup ? "done" : "", species: vs.species.length ? `${vs.species.length}` : "", count: pr.total ? `${pr.done}/${pr.total}` : "", validate: vs.validation ? `${Object.keys(vs.validation.counts).length}/${qcSample(CUR).length}` : "", report: "" };
  document.getElementById("steps").innerHTML = STEPS.map(([k, label]) => `<a href="#${k}" ${screen === k ? 'aria-current="page"' : ""} class="${st[k] === "done" || (k === "count" && pr.total && pr.done === pr.total) ? "done" : ""}">${label}${st[k] ? ` <span class="st">${st[k] === "done" ? "✓" : st[k]}</span>` : ""}</a>`).join("");
  const me = document.getElementById("me"); if (me.value !== S.me) me.value = S.me;
}
document.getElementById("me").addEventListener("change", (e) => { S.me = e.target.value.trim(); save(); });

// ---------- video element ----------
function makeVideo(v, { missingText } = {}) {
  const wrap = document.createElement("div"); wrap.className = "vwrap";
  const vid = document.createElement("video"); vid.muted = true; vid.playsInline = true; vid.preload = "auto";
  if (v.sample) vid.src = S.videoUrl; wrap.appendChild(vid);
  const overlay = document.createElement("div"); overlay.className = "overlay"; wrap.appendChild(overlay);
  const stamp = document.createElement("div"); stamp.className = "stamp"; stamp.textContent = "0:00.0"; overlay.appendChild(stamp);
  const miss = document.createElement("div"); miss.className = "missing hidden"; wrap.appendChild(miss);
  if (!v.sample) { miss.classList.remove("hidden"); miss.textContent = missingText || "This video isn't on this PC. The flow still works; the player stays empty."; }
  vid.addEventListener("error", () => { miss.classList.remove("hidden"); miss.textContent = `Can't load the video from ${S.videoUrl}. Start the Tideflow server, or change the address in Settings.`; });
  vid.addEventListener("timeupdate", () => { stamp.textContent = clock1(vid.currentTime); });
  return { wrap, vid, overlay, stamp };
}
function drawBoxes(overlay, boxes) {
  overlay.querySelectorAll(".box").forEach((b) => b.remove());
  boxes.forEach(([x, y, w, h]) => { const b = document.createElement("div"); b.className = "box"; b.style.left = `${x * 100}%`; b.style.top = `${y * 100}%`; b.style.width = `${w * 100}%`; b.style.height = `${h * 100}%`; overlay.appendChild(b); });
}

// ---------- screens ----------
const main = document.getElementById("main");

function screenSurvey() {
  main.innerHTML = `
    <div><h1>Fall 2025 · Baseline</h1><p class="lede">One row per video, named the way the hard drive names them. Each video goes through the procedure's steps in order; a second person validates at the end.</p></div>
    <div class="panel vlist">${VIDEOS.map((v) => { const pr = progress(v), stage = videoStage(v), { transect, stat } = transectStat(v.name); const vs = vstate(v.id); const mc = vs.setup && pr.total && pr.done === pr.total ? meanCount(v, pointTimes(v).map((_, i) => vs.points[i]?.couldNotSee ? null : vs.points[i]?.total ?? null)) : null; return `
      <div class="vrow">
        <div><div class="name">${esc(v.name)}</div><div class="sub">Transect ${transect || "?"} · STAT ${stat || "?"} · ${clock(v.duration)}${vs.setup ? ` · window ${clock(vs.setup.start)}–${clock(vs.setup.start + P().windowS)}` : ""}${mc !== null ? ` · MeanCount ${mc.toFixed(2)}` : ""}</div></div>
        <span class="pill ${stage === "Validated" ? "ok" : stage.startsWith("Video") ? "muted" : stage === "Recount" ? "bad" : ""}">${stage}</span>
        <button class="btn ${v.sample ? "primary" : ""}" data-open="${v.id}" ${v.sample ? "" : "disabled"}>${stage === "Set up" ? "Start" : stage.startsWith("Count") ? "Continue" : stage === "Validate" ? "Validate" : "Open"}</button>
      </div>`; }).join("")}</div>
    <div class="panel"><h3>Procedure v${P().version}</h3><p class="lede">Window ${P().windowS / 60} min after discarding the first ${P().trimStart / 60} min (up to ${P().extraTrim / 60} more if sediment persists). One point every ${P().everyS} s, ${Math.floor(P().windowS / P().everyS)} points. Context ±${P().contextS} s. Validation: ${Math.round(P().qcShare * 100)}% of points, at least ${P().qcMin}, within ${P().qcMaxDiff}% difference, ${P().qcAgree}% agreement. Change these in <a href="#settings">Settings</a>; the report records the version used.</p></div>`;
  main.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { CUR = VIDEOS.find((v) => v.id === b.dataset.open); const stage = videoStage(CUR); location.hash = stage === "Set up" ? "setup" : stage.startsWith("Count") ? "count" : stage === "Validate" || stage === "Recount" ? "validate" : "report"; });
}

function screenSetup() {
  const v = CUR, vs = vstate(v.id), sug = suggestStart(v), cur = vs.setup?.start ?? sug;
  const counted = progress(v).done;
  main.innerHTML = `
    <div><h1>Set up the count</h1><p class="lede">Choose where the ${P().windowS / 60}-minute window starts, record horizontal visibility, note juveniles. About a minute of work.</p></div>
    <div class="grid2">
      <div class="panel"><div id="v"></div><div class="row"><button class="btn sm" id="play">Play from start</button><span class="foot">The player seeks to the chosen start so you can see whether sediment has settled.</span></div></div>
      <div class="panel">
        <h3>Analysis window</h3>
        <div class="row"><label class="field">Start <input id="start" value="${clock(cur)}" class="mono" style="width:90px"></label>
          <input type="range" id="range" min="${P().trimStart}" max="${maxStart(v)}" value="${cur}" style="flex:1; min-width:140px">
        </div>
        <p class="foot" id="win"></p>

/** Count and Validate share this: a clip around one point, a form, and an AI check after the person has counted. */
function pointCounter({ v, indices, store, mode, onAllDone }) {
  const vs = vstate(v.id), ts = pointTimes(v), ctx = P().contextS;
  let i = indices[0];
  main.innerHTML = `
    <div class="row" style="justify-content:space-between"><div><h1 id="title"></h1><p class="lede" id="sub"></p></div></div>
    <div class="points" id="pts"></div>
    <div class="grid2">
      <div class="panel">
        <div id="v"></div>
        <div class="clipbar" id="bar"><div class="second" id="sec"></div><div class="head" id="head"></div></div>
        <div class="clipscale" id="scale"></div>
        <div class="row">
          <button class="btn" id="replay">Replay (R)</button>
          <button class="btn" id="toSec">Jump to the second (T)</button>
          <span class="chips" id="rates"><button class="chip" data-rate="0.25" aria-pressed="true">0.25×</button><button class="chip" data-rate="0.5">0.5×</button><button class="chip" data-rate="1">1×</button></span>
          <button class="btn sm" id="back">◀ frame</button><button class="btn sm" id="fwd">frame ▶</button>
        </div>
        <div class="keys"><span><kbd>R</kbd> replay</span><span><kbd>T</kbd> to the second</span><span><kbd>,</kbd> <kbd>.</kbd> step frame</span><span><kbd>Enter</kbd> save</span><span><kbd>N</kbd> next point</span></div>
        <div class="note info" id="rule"></div>
      </div>
      <div class="panel" id="form"></div>
    </div>`;
  const { wrap, vid, overlay, stamp } = makeVideo(v); document.getElementById("v").appendChild(wrap);
  const pts = document.getElementById("pts");
  const t = () => ts[i], a = () => t() - ctx, b = () => t() + 1 + ctx;
  let rate = 0.25, showBoxes = false, loopTimer = null;
  const renderPts = () => { pts.innerHTML = indices.map((k) => { const st = mode === "validate" ? (store()[k] ? "counted" : "open") : pointStatus(v, k); return `<button data-i="${k}" class="${st === "counted" ? "counted" : st === "could-not-see" ? "cns" : ""}" ${k === i ? 'aria-current="true"' : ""}><span class="n">${k + 1}</span><span class="t">${clock(ts[k])}</span><span>${st === "counted" ? (mode === "validate" ? store()[k].total : vs.points[k].total) : st === "could-not-see" ? "—" : ""}</span></button>`; }).join(""); pts.querySelectorAll("button").forEach((x) => x.onclick = () => open(+x.dataset.i)); };
  const seekPlay = (to) => { if (!v.sample) return; try { vid.currentTime = to; } catch {} vid.playbackRate = rate; vid.play(); };
  const replay = () => seekPlay(a());
  vid.addEventListener("timeupdate", () => {
    const c = vid.currentTime, inSec = c >= t() && c < t() + 1, headEl = document.getElementById("head");
    if (!headEl) return;
    headEl.style.left = `${Math.min(100, Math.max(0, (c - a()) / (b() - a()) * 100))}%`;
    stamp.textContent = `${clock1(c)}  ${inSec ? "COUNTING SECOND" : c < t() ? `${(t() - c).toFixed(1)} s before` : `${(c - t() - 1).toFixed(1)} s after`}`; stamp.classList.toggle("now", inSec);
    if (c >= b()) vid.pause();
    overlay.querySelectorAll(".box").forEach((x) => x.style.display = showBoxes && c >= t() - 0.5 && c < t() + 1.5 ? "" : "none");
  });
  document.getElementById("replay").onclick = replay;
  document.getElementById("toSec").onclick = () => seekPlay(t());
  document.getElementById("back").onclick = () => { vid.pause(); vid.currentTime = Math.max(0, vid.currentTime - 1 / 30); };
  document.getElementById("fwd").onclick = () => { vid.pause(); vid.currentTime += 1 / 30; };
  main.querySelectorAll("[data-rate]").forEach((x) => x.onclick = () => { rate = +x.dataset.rate; vid.playbackRate = rate; main.querySelectorAll("[data-rate]").forEach((y) => y.setAttribute("aria-pressed", y === x)); });
  const form = document.getElementById("form");
  function open(k) {
    i = k; showBoxes = false; drawBoxes(overlay, boxesAt(v, t()));
    const existing = mode === "validate" ? store()[i] : vs.points[i];
    document.getElementById("title").textContent = `${mode === "validate" ? "Validate" : "Count"} point ${i + 1} of ${ts.length} · ${clock(t())}`;
    document.getElementById("sub").textContent = mode === "validate" ? "Blind second count. The first person's count is hidden until you save." : `Watch ${clock(a())}–${clock(b())} at 0.25×, count only what is in the second ${clock(t())}.`;
    document.getElementById("sec").style.left = `${ctx / (2 * ctx + 1) * 100}%`; document.getElementById("sec").style.width = `${1 / (2 * ctx + 1) * 100}%`;
    document.getElementById("scale").innerHTML = `<span>${clock(a())}</span><span>${clock(t())} · count this second</span><span>${clock(b())}</span>`;
    document.getElementById("rule").innerHTML = `Count a fish only if at least two of: shape · fins, scales, eyes · colour or flash · movement. A fish entering within ${ctx > 5 ? "0.5–1" : "0.5–1"} s of the second counts; one that appears a full second later does not (note it). When unsure, leave it out.`;
    const species = existing?.species?.length ? existing.species : [];
    form.innerHTML = `
      <h3>Record for ${clock(t())}</h3>
      <div class="row"><label class="field">Total fish <input type="number" id="total" min="0" value="${existing && !existing.couldNotSee ? existing.total : ""}" placeholder="0"></label>
        <label class="field">Invertebrates <input type="number" id="inv" min="0" value="${existing?.invert ?? ""}" placeholder="0"></label>
        <label class="field">Visibility <select id="visc"><option value="">No change</option>${VIS.map((x) => `<option ${existing?.visChange === x ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
      <h3>By species</h3>
      <div class="chips" id="spChips">${[...new Set([...vs.species.map((s) => s.name), ...species.map((s) => s.name)])].map((n) => `<button class="chip" data-sp="${esc(n)}">+ ${esc(n)}</button>`).join("")}<button class="chip" data-sp="">+ other</button></div>
      <div class="sprows" id="spRows"></div>
      <p class="foot" id="unk"></p>
      <h3>Notes</h3>
      <div class="chips">${NOTE_CHIPS.map((n) => `<button class="chip" data-note="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      <label class="field"><textarea id="notes" placeholder="Visibility, which characteristics you used, fish you could not confirm…">${esc(existing?.notes ?? "")}</textarea></label>
      <div class="row"><button class="btn primary" id="save">Save count (Enter)</button><button class="btn warn" id="cns">Could not see</button></div>
      <div id="ai" class="hidden"></div>
      <div class="row hidden" id="nextRow"><button class="btn primary" id="next">Next point (N)</button></div>`;
    const rows = document.getElementById("spRows");
    const renderRows = () => { rows.innerHTML = species.map((s, k) => `<div class="row"><input type="text" list="splist2" value="${esc(s.name)}" data-k="${k}" data-f="name" placeholder="Species"><input type="number" min="0" value="${s.n}" data-k="${k}" data-f="n"><button class="btn sm" data-rm="${k}">×</button></div>`).join("") + `<datalist id="splist2">${SPECIES.map((s) => `<option value="${s}">`).join("")}</datalist>`; rows.querySelectorAll("input").forEach((x) => x.oninput = () => { species[+x.dataset.k][x.dataset.f] = x.dataset.f === "n" ? +x.value : x.value; unknown(); }); rows.querySelectorAll("[data-rm]").forEach((x) => x.onclick = () => { species.splice(+x.dataset.rm, 1); renderRows(); unknown(); }); unknown(); };
    const unknown = () => { const total = +document.getElementById("total").value || 0, named = species.reduce((n, s) => n + (+s.n || 0), 0), u = total - named; document.getElementById("unk").innerHTML = u < 0 ? `<span style="color:var(--bad)">Species add up to ${named}, more than the total ${total}.</span>` : `Unknown / unable to ID: <b class="mono">${u}</b> of ${total}`; };
    renderRows();
    form.querySelectorAll("[data-sp]").forEach((x) => x.onclick = () => { species.push({ name: x.dataset.sp, n: 1 }); renderRows(); });
    form.querySelectorAll("[data-note]").forEach((x) => x.onclick = () => { const n = document.getElementById("notes"); n.value = (n.value ? n.value + "; " : "") + x.dataset.note; });
    document.getElementById("total").oninput = unknown;
    const finish = (rec) => {
      rec.by = S.me || "unnamed"; rec.at = new Date().toISOString(); rec.aiCount = aiAt(v, t());
      store()[i] = rec; save(); renderPts(); renderShell(mode === "validate" ? "validate" : "count");
      const ai = document.getElementById("ai"); ai.classList.remove("hidden"); document.getElementById("nextRow").classList.remove("hidden");
      if (rec.aiCount === null) { ai.innerHTML = `<div class="note">No AI output for this video.</div>`; }
      else if (rec.couldNotSee) { ai.innerHTML = `<div class="note">Saved as could not see. AI had ${rec.aiCount} detections here; they don't count.</div>`; }
      else { const more = rec.aiCount - rec.total; ai.innerHTML = `<div class="aicheck ${more <= 0 ? "same" : ""}"><b>AI saw ${rec.aiCount} fish in this second, you counted ${rec.total}.</b><span class="foot">${more > 0 ? "AI boxes are now shown on the clip. Look again if you want; your count stands unless you change it." : "Nothing to add. AI's boxes are shown for reference."}</span><div class="row"><button class="btn" id="look">Look again with AI boxes</button>${more > 0 ? `<button class="btn" id="keep">Keep my count</button>` : ""}</div></div>`; showBoxes = true; document.getElementById("look").onclick = () => { showBoxes = true; replay(); }; document.getElementById("keep")?.addEventListener("click", () => { rec.aiReviewed = "kept"; save(); document.getElementById("keep").textContent = "Kept"; }); }
      document.getElementById("next").onclick = next;
    };
    document.getElementById("save").onclick = () => { const total = +document.getElementById("total").value; const named = species.reduce((n, s) => n + (+s.n || 0), 0); if (named > total) { document.getElementById("total").focus(); return; } const rec = { t: t(), total, invert: +document.getElementById("inv").value || 0, species: species.filter((s) => s.name && s.n > 0), unknown: total - named, visChange: document.getElementById("visc").value || null, notes: document.getElementById("notes").value.trim(), couldNotSee: false }; if (store()[i]?.aiReviewed && store()[i].total !== total) rec.aiReviewed = "revised"; finish(rec); };
    document.getElementById("cns").onclick = () => finish({ t: t(), total: null, invert: null, species: [], unknown: null, visChange: document.getElementById("visc").value || null, notes: document.getElementById("notes").value.trim(), couldNotSee: true });
    form.onkeydown = (e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); document.getElementById("save").click(); } };
    renderPts(); replay(); setTimeout(() => document.getElementById("total").focus(), 50);
  }
  const next = () => { const k = indices.find((x) => x > i && (mode === "validate" ? !store()[x] : pointStatus(v, x) === "open")) ?? indices.find((x) => mode === "validate" ? !store()[x] : pointStatus(v, x) === "open"); if (k === undefined) onAllDone(); else open(k); };
  main.onkeydown = (e) => { if (e.target.matches("input, textarea, select")) { if (e.key === "Escape") e.target.blur(); return; } if (e.key === "r") replay(); if (e.key === "t") seekPlay(t()); if (e.key === ",") document.getElementById("back").click(); if (e.key === ".") document.getElementById("fwd").click(); if (e.key === "n") next(); if (e.key === "p") open(indices[Math.max(0, indices.indexOf(i) - 1)]); };
  main.tabIndex = -1;
  const firstOpen = indices.find((x) => mode === "validate" ? !store()[x] : pointStatus(v, x) === "open") ?? indices[0];
  vid.addEventListener("loadedmetadata", () => replay(), { once: true });
  open(firstOpen);
}

function screenCount() {
  const v = CUR, vs = vstate(v.id); if (!vs.setup) { location.hash = "setup"; return; }
  pointCounter({ v, indices: pointTimes(v).map((_, i) => i), store: () => vs.points, mode: "count", onAllDone: () => { location.hash = "report"; } });
}

function screenValidate() {
  const v = CUR, vs = vstate(v.id); if (!vs.setup) { location.hash = "setup"; return; }
  const pr = progress(v), sample = qcSample(v);
  if (pr.done < pr.total) { main.innerHTML = `<div><h1>Validate</h1><p class="lede">Validation starts after all ${pr.total} points are counted. ${pr.done} done so far.</p></div><div class="row"><a class="btn primary" href="#count">Continue counting</a></div>`; return; }
  vs.validation ??= { by: "", counts: {} };
  const res = validationResult(v);
  if (!res.complete) {
    if (!vs.validation.by) {
      main.innerHTML = `<div><h1>Validate</h1><p class="lede">A second person counts ${sample.length} randomly chosen points (${Math.round(P().qcShare * 100)}% of ${pr.total}, at least ${P().qcMin}) without seeing the first count. Points ${sample.map((i) => i + 1).join(", ")} were drawn for this video.</p></div>
        <div class="panel"><div class="row"><label class="field">Validator's name <input id="vname" value="${esc(S.me)}"></label><button class="btn primary" id="go">Start blind count</button></div><p class="foot">The first count was made by ${esc([...new Set(Object.values(vs.points).map((p) => p.by))].join(", ") || "unnamed")}. The protocol prefers a different person.</p></div>`;
      document.getElementById("go").onclick = () => { vs.validation.by = document.getElementById("vname").value.trim() || "validator"; const keep = S.me; S.me = vs.validation.by; save(); S.me = keep; save(); screenValidate(); };
      return;
    }
    const keepMe = S.me; S.me = vs.validation.by;
    pointCounter({ v, indices: sample, store: () => vs.validation.counts, mode: "validate", onAllDone: () => { S.me = keepMe; save(); screenValidate(); } });
    return;
  }
  const bad = res.rows.filter((r) => r.diff !== null && r.diff > P().qcMaxDiff);
  main.innerHTML = `
    <div><h1>Validation</h1><p class="lede">${sample.length} points counted twice. Agreement ${res.agree.toFixed(0)}% (within ${P().qcMaxDiff}% difference). ${res.pass ? "Passes the protocol's " + P().qcAgree + "% threshold." : "Below " + P().qcAgree + "%: the flagged points need a third count, preferably by another person; if agreement stays low the video is re-annotated."}</p></div>
    <div class="note ${res.pass ? "ok" : "bad"}">${res.pass ? "Validated" : `${bad.length} point${bad.length > 1 ? "s" : ""} differ by more than ${P().qcMaxDiff}%`} · first count by ${esc([...new Set(Object.values(vs.points).map((p) => p.by))].join(", "))}, validation by ${esc(vs.validation.by)}</div>
    <div class="panel tablewrap"><table><thead><tr><th>Point</th><th>Time</th><th class="r">First count</th><th class="r">Blind count</th><th class="r">Average</th><th class="r">Difference</th><th>Third count</th></tr></thead><tbody>
      ${res.rows.map((r) => `<tr><td class="mono">${r.i + 1}</td><td class="mono">${clock(ts(v)[r.i])}</td><td class="r mono">${r.a ?? "could not see"}</td><td class="r mono">${r.b ?? "—"}</td><td class="r mono">${r.diff === null ? "—" : ((r.a + r.b) / 2).toFixed(1)}</td><td class="r mono" style="color:${r.diff !== null && r.diff > P().qcMaxDiff ? "var(--bad)" : "inherit"}">${r.diff === null ? "—" : r.diff.toFixed(0) + "%"}</td><td>${r.diff !== null && r.diff > P().qcMaxDiff ? `<span class="row"><input type="number" min="0" class="mono" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);color:inherit" data-third="${r.i}" value="${r.third ?? ""}" placeholder="count"><span class="foot">by another person</span></span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row"><a class="btn primary" href="#report">Open report</a><button class="btn" id="redo">Redo validation</button></div>`;
  main.querySelectorAll("[data-third]").forEach((x) => x.onchange = () => { vs.validation.counts[+x.dataset.third].third = x.value === "" ? null : +x.value; save(); });
  document.getElementById("redo").onclick = () => { vs.validation = null; save(); screenValidate(); };
}
const ts = (v) => pointTimes(v);

function screenReport() {
  const v = CUR, vs = vstate(v.id); if (!vs.setup) { location.hash = "setup"; return; }
  const times = pointTimes(v), pts = times.map((t, i) => vs.points[i] ?? null);
  const counts = pts.map((p) => !p || p.couldNotSee ? null : p.total), mc = meanCount(v, counts), inv = meanCount(v, pts.map((p) => !p || p.couldNotSee ? null : p.invert));
  const cns = pts.filter((p) => p?.couldNotSee).length, counted = counts.filter((x) => x !== null).length;
  const speciesSeen = [...new Set([...vs.species.map((s) => s.name), ...pts.flatMap((p) => p?.species?.map((s) => s.name) ?? [])])];
  const res = validationResult(v), { transect, stat } = transectStat(v.name), from = vs.setup.start, to = from + P().windowS;
  const d = v.sample?.();
  const busiest = d ? d.detections.map((n, s) => ({ s, n })).filter((x) => x.s >= from && x.s < to && x.n >= 5 && times.every((t) => Math.abs(t - x.s) > 1)).sort((a, b) => b.n - a.n).slice(0, 5) : [];
  const sens = d ? Array.from({ length: P().everyS }, (_, off) => { const vals = times.map((t) => d.detections[t + off] ?? 0); return vals.reduce((a, b) => a + b, 0) / vals.length; }) : [];
  const stage = videoStage(v);
  main.innerHTML = `
    <div class="row" style="justify-content:space-between"><div><h1>Report · ${esc(v.name)}</h1><p class="lede">Window ${clock(from)}–${clock(to)}, procedure v${P().version}, ${times.length} points every ${P().everyS} s. Only counts a person made are in MeanCount.</p></div><div class="row"><button class="btn primary" id="csv">Export analysis sheet (CSV)</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>MeanCount</span><b>${mc === null ? "—" : mc.toFixed(2)}</b><small>${counted} of ${times.length} points counted${cns ? `, ${cns} could not see` : ""}</small></div>
      <div class="kpi"><span>Invertebrates per point</span><b>${inv === null ? "—" : inv.toFixed(2)}</b></div>
      <div class="kpi"><span>Species observed</span><b>${speciesSeen.length}</b><small>${esc(speciesSeen.join(", ")) || "none named"}</small></div>
      <div class="kpi"><span>Visibility</span><b style="font-size:20px">${vs.setup.visibility || "—"}</b><small>Juveniles ${vs.setup.juveniles == null ? "not noted" : vs.setup.juveniles ? "present (1)" : "absent (0)"}</small></div>
      <div class="kpi"><span>Validation</span><b style="font-size:20px">${res.complete ? `${res.agree.toFixed(0)}%` : "—"}</b><small>${stage === "Validated" ? "validated" : res.complete ? "needs recount" : "not validated yet"}</small></div>
    </div>
    <div class="panel"><h3>Provenance</h3><p class="foot">Set up by ${esc(vs.setup.by || "unnamed")}. Species pass: ${vs.setup.speciesMode === "whole" ? "whole window watched in real time" : vs.setup.speciesMode === "flagged" ? "AI-flagged segments only" : "not recorded"}. Counted by ${esc([...new Set(pts.filter(Boolean).map((p) => p.by))].join(", ") || "—")}. Validated by ${esc(vs.validation?.by || "—")}. AI output used only as suggestions: ${pts.filter((p) => p?.aiReviewed === "revised").length} point${pts.filter((p) => p?.aiReviewed === "revised").length === 1 ? "" : "s"} revised after looking again, ${pts.filter((p) => p?.aiReviewed === "kept").length} kept as counted.</p></div>
    <div class="panel tablewrap"><h2>Sub-sample points</h2><table><thead><tr><th>#</th><th>Time</th><th class="r">Fish</th><th class="r">Invert.</th><th>Species</th><th class="r">Unknown</th><th>Visibility</th><th>Notes</th><th class="r">AI saw</th><th>By</th></tr></thead><tbody>
      ${times.map((t, i) => { const p = pts[i]; return `<tr><td class="mono">${i + 1}</td><td class="mono">${clock(t)}</td><td class="r mono">${!p ? "—" : p.couldNotSee ? "could not see" : p.total}</td><td class="r mono">${p && !p.couldNotSee ? p.invert : "—"}</td><td>${p?.species?.map((s) => `${esc(s.name)} ${s.n}`).join(", ") ?? ""}</td><td class="r mono">${p && !p.couldNotSee ? p.unknown : ""}</td><td>${p?.visChange ?? ""}</td><td class="foot">${esc(p?.notes ?? "")}</td><td class="r mono foot">${aiAt(v, t) ?? "—"}</td><td class="foot">${esc(p?.by ?? "")}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="grid2">
      <div class="panel"><h2>Species seen in the window</h2>${vs.species.length ? `<table><thead><tr><th>Species</th><th>First seen</th><th>Note</th></tr></thead><tbody>${vs.species.map((s) => `<tr><td>${esc(s.name)}</td><td class="mono">${clock(s.t)}</td><td class="foot">${esc(s.note)}</td></tr>`).join("")}</tbody></table>` : `<p class="foot">Nothing recorded in the species pass.</p>`}</div>
      <div class="panel"><h2>Busiest moments between points</h2><p class="foot">MeanCount only sees the ${times.length} points. These are the seconds between them where AI saw the most fish. Unchecked AI output; shown so a reader knows what the points missed. They never change MeanCount.</p>
        ${busiest.length ? `<table><thead><tr><th>Time</th><th class="r">AI saw</th></tr></thead><tbody>${busiest.map((x) => `<tr><td class="mono">${clock(x.s)}</td><td class="r mono">${x.n}</td></tr>`).join("")}</tbody></table>` : `<p class="foot">No AI output.</p>`}
        ${sens.length ? `<p class="foot">Sensitivity: if the window started 0–${P().everyS - 1} s later, AI's own mean over the ${times.length} points would range from <b class="mono">${Math.min(...sens).toFixed(2)}</b> to <b class="mono">${Math.max(...sens).toFixed(2)}</b> (median ${median(sens).toFixed(2)}). AI numbers, trend only.</p>` : ""}
      </div>
    </div>`;
  document.getElementById("csv").onclick = () => {
    const spCols = [...new Set(pts.flatMap((p) => p?.species?.map((s) => s.name) ?? []))];
    const head = ["Video ID", "Transect", "STAT", "Analysis Start", "Analysis End", "Sub-sample", "Video Time", "Visibility", "Total Fish Count", "Invertebrate Count", ...spCols, "Unknown/Unable to ID due to visibility", "Total Species Observed", "Notes", "Counted by", "Validation count", "Difference %"];
    const q = (x) => `"${String(x ?? "").replace(/"/g, '""')}"`;
    const rows = times.map((t, i) => { const p = pts[i], vr = res.rows.find((r) => r.i === i); return [v.name, transect, stat, clock(from), clock(to), i + 1, clock(t), p?.visChange || vs.setup.visibility || "", !p ? "" : p.couldNotSee ? "could not see" : p.total, p && !p.couldNotSee ? p.invert : "", ...spCols.map((c) => p?.species?.find((s) => s.name === c)?.n ?? ""), p && !p.couldNotSee ? p.unknown : "", p && !p.couldNotSee ? p.species.length : "", p?.notes ?? "", p?.by ?? "", vr?.b ?? "", vr?.diff == null ? "" : vr.diff.toFixed(0)]; });
    const tail = [[], ["MeanCount", mc === null ? "" : mc.toFixed(3)], ["Points counted", counted], ["Points could not see", cns], ["Mean invertebrates", inv === null ? "" : inv.toFixed(3)], ["Species richness", speciesSeen.length], ["Species observed", speciesSeen.join("; ")], ["Horizontal visibility", vs.setup.visibility || ""], ["Juveniles present", vs.setup.juveniles ?? ""], ["Species pass", vs.setup.speciesMode || ""], ["Validation agreement %", res.complete ? res.agree.toFixed(0) : ""], ["Procedure version", P().version]];
    const csv = "﻿" + [head, ...rows, ...tail].map((r) => r.map(q).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `${v.name.replace(/\.[^.]+$/, "")}-analysis.csv`; a.click();
  };
}

function screenSettings() {
  const p = P();
  main.innerHTML = `
    <div><h1>Settings</h1><p class="lede">The procedure's parameters, in one place, because the draft hasn't settled them. Changing a parameter regenerates the points of every video; counts made under the old grid are discarded.</p></div>
    <div class="grid2">
      <div class="panel"><h3>This PC</h3>
        <label class="field">Your name (recorded with every count) <input id="me" value="${esc(S.me)}"></label>
        <label class="field">Video address for ${esc(VIDEOS[0].name)} <input id="url" value="${esc(S.videoUrl)}"></label>
        <p class="foot">The prototype plays the video from a running Tideflow server; any direct MP4 address also works.</p>
        <div class="row"><button class="btn primary" id="savePc">Save</button><button class="btn warn" id="reset">Reset all counts</button></div></div>
      <div class="panel"><h3>Procedure v${p.version}</h3>
        <div class="row">
          <label class="field">Window (s) <input type="number" id="windowS" value="${p.windowS}"></label>
          <label class="field">Every (s) <input type="number" id="everyS" value="${p.everyS}"></label>
          <label class="field">Context ± (s) <input type="number" id="contextS" value="${p.contextS}"></label></div>
        <div class="row">
          <label class="field">Discard start (s) <input type="number" id="trimStart" value="${p.trimStart}"></label>
          <label class="field">Extra allowed (s) <input type="number" id="extraTrim" value="${p.extraTrim}"></label>
          <label class="field">Discard end (s) <input type="number" id="trimEnd" value="${p.trimEnd}"></label></div>
        <div class="row">
          <label class="field">QC share <input type="number" id="qcShare" step="0.05" value="${p.qcShare}"></label>
          <label class="field">QC min points <input type="number" id="qcMin" value="${p.qcMin}"></label>
          <label class="field">Max difference % <input type="number" id="qcMaxDiff" value="${p.qcMaxDiff}"></label>
          <label class="field">Agreement % <input type="number" id="qcAgree" value="${p.qcAgree}"></label></div>
        <p class="foot">Draft text: 15 min, every 60 s, ±5 s, 10%. Draft comments: 60 points (every 12 s over 12 min), ±10 s, 15–20% QC. Try <button class="btn sm" id="p60">60 points</button> <button class="btn sm" id="p15">back to 15 points</button></p>
        <div class="row"><button class="btn primary" id="saveP">Save as v${p.version + 1}</button></div></div>
    </div>`;
  document.getElementById("savePc").onclick = () => { S.me = document.getElementById("me").value.trim(); S.videoUrl = document.getElementById("url").value.trim(); save(); renderShell("settings"); location.hash = "survey"; };
  document.getElementById("reset").onclick = () => { S.videos = {}; save(); location.hash = "survey"; };
  const setP = (vals) => { Object.assign(S.protocol, vals, { version: P().version + 1 }); S.videos = {}; save(); location.hash = "survey"; };
  document.getElementById("saveP").onclick = () => setP(Object.fromEntries(["windowS", "everyS", "contextS", "trimStart", "extraTrim", "trimEnd", "qcShare", "qcMin", "qcMaxDiff", "qcAgree"].map((k) => [k, +document.getElementById(k).value])));
  document.getElementById("p60").onclick = () => setP({ windowS: 720, everyS: 12, contextS: 5 });
  document.getElementById("p15").onclick = () => setP({ windowS: 900, everyS: 60, contextS: 5 });
}

// ---------- router ----------
const SCREENS = { survey: screenSurvey, setup: screenSetup, species: screenSpecies, count: screenCount, validate: screenValidate, report: screenReport, settings: screenSettings };
function route() { const k = location.hash.replace("#", "") || "survey"; main.onkeydown = null; main.querySelectorAll("video").forEach((x) => { x.pause(); x.removeAttribute("src"); x.load(); }); (SCREENS[k] || screenSurvey)(); renderShell(k); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
