[project]
name = "tidecount"
version = "0.1.0"
description = "Local fish video review workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "imageio-ffmpeg>=0.5",
  "rfdetr==1.11.2",
  "supervision>=0.25",
  "trackers>=2",
  "open_clip_torch>=3",
  "ultralytics>=8.4.203",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "anywidget>=0.11.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "tqdm>=4.70.1",
    "yt-dlp>=2026.10.26",
]
