name: tidecount

on:
  pull_request:
    paths: ["tidecount/**", ".github/workflows/tidecount-ci.yml"]
  push:
    branches: [main]
    paths: ["tidecount/**", ".github/workflows/tidecount-ci.yml"]

jobs:
  python:
    name: server and ml tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tidecount/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tidecount/server/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen pytest -q ../ml

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tidecount/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tidecount/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
